[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "gridsteer"
version = "0.1"
dependencies = [
    "h5py",
    "scipy",
    "matplotlib",
    "scikit-image",
    "opencv-python",
    "imageio",
    "numpy",
    # "rembg[cpu]",  # or "rembg[gpu]" for GPU acceleration
    "Pillow",
    "scikit-learn",
    "imageio",
    "imageio-ffmpeg",
]

[project.optional-dependencies]
rembg-cpu = ["rembg[cpu]"]
rembg-gpu = ["rembg[gpu]"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gridsteer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["validation: slow end-to-end run on a dataset under data/"]
addopts = "-ra"

